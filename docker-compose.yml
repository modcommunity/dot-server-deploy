# A TMC server, in one command.
#
#   docker compose up -d        start it
#   docker compose logs -f      watch it
#   docker compose down         stop it
#
# The build context is the PARENT directory, not this one. Every dot-* addon is its own
# repository and there is no way to clone the tree at once, so the addons this project
# needs are siblings rather than subdirectories. Dockerfile explains it at more length.

services:
  server:
    build:
      context: ..
      dockerfile: dot-server-deploy/Dockerfile
    image: tmc-server:latest
    container_name: tmc-server
    restart: unless-stopped

    # Host networking is NOT used, deliberately. It works and it makes the container
    # able to reach everything on the host's network, which for a process that accepts
    # connections from strangers is the wrong default. Publish the two ports instead.
    ports:
      # The game. WebSocket, because a browser has no UDP and Godot's web template does
      # not ship ENetMultiplayerPeer at all -- so a server that expects browser clients
      # listens on WebSocket, and then all of its clients do.
      - "6064:6064/tcp"
      # RCON. Bound to loopback on the host: it is a remote console, and the password is
      # the only thing between it and whoever finds the port. Reach it through an SSH
      # tunnel, or put an address allow-list in cfg/rcon.yml and widen this deliberately.
      - "127.0.0.1:6065:6065/tcp"

    # The host's own uid, so the bind mounts below are writable by the server and the
    # files it creates are editable by you. A uid baked into the image cannot be
    # yours, and the symptom is the server refusing to write its own generated config
    # with a permission error that reads as a broken image.
    #
    #   UID=$(id -u) GID=$(id -g) docker compose up -d
    #
    # 1000:1000 is the default because it is the first user on almost every Linux
    # install. It is deliberately not root.
    user: "${UID:-1000}:${GID:-1000}"

    volumes:
      # Read-write: the first run writes cfg/ into it, including an RCON password
      # generated once. That is setup.sh's "never overwrite a config that exists" rule
      # reached from a container's direction — an image rebuild must not throw away
      # the settings an operator has been using.
      - ./cfg:/srv/tmc/cfg
      # READ-WRITE, and it used to be `:ro` for a reason that has since stopped
      # being true.
      #
      # The old comment said "the server never writes to its content". It does
      # now: `./server install-games` fetches a game's `game.yml` descriptor out
      # of its signed pack and writes it to `content/<id>/game.yml`, so a
      # container started with TMC_GAMES and a read-only content mount fails to
      # install a single game -- and fails at startup, on a box that looks
      # correctly configured.
      #
      # Put `:ro` back on a deployment that carries its own content and sets no
      # TMC_GAMES. It is a real protection and it costs nothing there.
      - ./content:/srv/tmc/content
      # Everything the server writes: admins, bans, the audit log, the generated config.
      - ./data:/srv/tmc/data

    environment:
      # Only what a deployment genuinely decides from outside. There is no
      # TMC_RCON_PASSWORD and there will not be: an environment variable is readable by
      # every other process in the container and appears in `docker inspect`, which is
      # exactly why DotConfig refuses secrets from the environment.
      TMC_PORT: "6064"
      # TMC_NAME: "My server"
      # TMC_MAX_PLAYERS: "64"
      # TMC_GAME: "lobby"

      # --- Installing games instead of carrying them ---------------------------
      #
      # `./server` reads these three out of the environment itself, so they need
      # no translation in docker-entrypoint.sh -- which is why that script still
      # lists only four.
      #
      # TMC_GAMES is the list this server is FOR. An entry is one of three
      # spellings and the spelling decides where the game comes from:
      #
      #   g2gfast                        a game this image already carries
      #   gamemann/game-g2gfast01        somebody's published pack, newest version
      #   gamemann/game-g2gfast01@1.2.0  that version
      #
      # It is also a filter: the games listing, `changelevel`, the vote menu and
      # the boot game all read this one set. TMC_GAME must name one of them, by
      # its short directory name rather than by the owner/name it installs under.
      #
      # Empty means "offer everything this image has", which is the right meaning
      # of saying nothing and is what a development box wants.
      #
      # Pair this with `--build-arg TMC_BUILD_GAMES=none` (see the Dockerfile) for
      # an image that carries no game and installs every one of them, or use the
      # docker-compose.games.yml overlay, which sets both.
      # TMC_GAMES: "g2gfast,arena"
      # TMC_CONTENT_URL: "https://dotgames.org/content"
      # TMC_GAMES_MODE: "hide"

      # --- The other three ports -----------------------------------------------
      #
      # RCON derives the game port plus one; A2S derives the game port itself,
      # which is free because the game is a WebSocket listener and therefore TCP;
      # and DQP derives the A2S port, so the two query protocols share one socket
      # and are told apart by their first four bytes.
      #
      # Set these only to move them, and publish whatever you set in `ports:`
      # above -- a listener on an unpublished port is reachable from inside the
      # container and nowhere else.
      # TMC_RCON_PORT: "27020"
      # TMC_A2S_PORT: "27015"
      # TMC_QUERY_PORT: "27016"

      # Which interface the query listeners bind. `*` is every one, and is the
      # setting a reverse-proxied server cannot do without: nginx forwards the
      # game's WebSocket and cannot forward UDP, so a query listener following a
      # loopback bind address listens where no tracker can reach it. RCON
      # deliberately does not follow this.
      TMC_QUERY_BIND: "*"

    # A game server should not be able to write anywhere but its data directory, and
    # should not be able to gain privileges it did not start with.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # A simulation loop plus one socket. The limits are here so a runaway is a container
    # that gets killed rather than a box that stops responding -- raise them for a busy
    # server rather than removing them.
    deploy:
      resources:
        limits:
          memory: 1g

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
