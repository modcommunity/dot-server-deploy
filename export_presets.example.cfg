; The export presets this project ships, and the ONLY copy of them that is tracked.
;
; `export_presets.cfg` is a file the Godot editor writes and rewrites, so it is
; gitignored for the same reason `cfg/` is: a file a tool edits in place cannot also be
; a file git is tracking. setup.sh and setup.ps1 copy this one to `export_presets.cfg`
; when there is none, which is what makes `./server export-web` and
; `./server export-native` work on a machine that has never opened this project in an
; editor -- the two commands used to need a preset nobody had, and said so only by
; failing.
;
; IT LANDS AT THE PROJECT ROOT, beside project.godot, and it cannot live in `cfg/` with
; the rest of the templates however much it would like to. Godot looks in exactly one
; place and says so:
;
;     ERROR: This project doesn't have an `export_presets.cfg` file at its root.
;
; So this file sits where its copy has to sit, and the only difference between the two
; names is `.example`.
;
; Four presets, and the differences between them are all load-bearing:
;
;   Web             the browser client. `--zip` feeds the site's publisher.
;   Linux x86_64    \
;   Windows x86_64   > the native client the desktop app installs. One file each:
;   macOS           /  embed_pck is on, so an install is a binary and not a pair.
;
; EVERY preset excludes the same seven things, and two of them matter. `host/*` is the
; SERVER, and a client build has no business carrying it. `maps/imported/*` is 66 MB of
; geometry that dot-cloud serves from the content origin on join -- carrying it as well
; would double a download to save a fetch that happens anyway. Both export commands
; check that what they excluded is published, because a map in neither place is a map a
; player spawns into as an empty sky.
;
; The macOS preset is universal, which is why `textures/vram_compression/import_etc2_astc`
; is on in project.godot: the exporter refuses a universal or arm64 binary without it.
; No texture here is VRAM-compressed, so it costs nothing.

[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="examples/*, tools/*, cfg/*, content/*, data/*, host/*, maps/imported/*, dist/*"
export_path="web/build/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

