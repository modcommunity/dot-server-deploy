# g2gfast. A bunny-hop and surf timer server, in the shape the genre grew up on:
# the movement cvars under their own names, a timer counted in ticks with sub-tick
# zone crossings, styles, records, and a replay bot running the server record.
#
#     changelevel g2gfast
#
# kind: pack -- delivered, for the reason content/lobby/game.yml sets out at length.
# Published with `./server pack g2gfast --source games/game-g2gfast`.
#
# ITS IMPORTED MAPS ARE NOT IN THIS PACK, and that is deliberate: `maps/imported/` is 66 MB
# of converted geometry published as one pack per map, so a player downloads the map the
# server is on rather than every map it could be on. `pack.json` excludes the directory.
#
# THE SCENE IS ALMOST EMPTY, ON PURPOSE. res://scenes/g2g_server.tscn is a G2GGame
# under a plain Node, and G2GGame registers itself under `g2g_game` in _ready() --
# which is what g2g_module.gd looks it up by. Nothing else is configured there:
# the operator's surface is the cvars below and the movement cvars the module
# registers, layered under G2G_* and --g2g-* like every DotConfig in the family. A
# scene full of defaults would be a fourth copy of them.
#
# NOT TWO GAME IDS. Hungry is here twice because its two modes are two presets of
# one world. Bhop and surf are not modes -- they are the same game on different
# geometry with a different sv_airaccelerate, and a timer server runs a ROTATION
# rather than a mode. Both maps are in the catalogue and `g2g_map` switches them.

name: g2gfast
content_id: tmc/g2gfast
version: 0.1.0
kind: pack
max_players: 32

scene: scenes/g2g_server.tscn
client_scene: game/g2g.tscn
module: game/g2g_module.gd

# Set when this game is loaded, and only while it is loaded. These are the module's
# own cvars in the genre's units, which is the whole point of them: an operator who
# has run one of these servers reads this block without being told anything.
#
# 1000 is the bunny-hop figure. A surf-only server runs 150 -- see the note above
# about why that is a cvar and a rotation rather than a second game id here.
# THE TICK RATE IS NOT IN THIS FILE AND CANNOT BE, which is worth saying because the
# number matters more here than in any other game on this server.
#
# This game's netcode runs a snapshot rate of 32, and dot-net requires the tick rate to
# be a MULTIPLE of it: 128 is four snapshots per send window, 64 is two, and the shipped
# default of 60 is neither. An uneven spacing arrives as jitter no interpolator can
# remove, and it reads to a player as lag on a server that is otherwise healthy --
# `tick_rate is not a multiple of snapshot_rate` in the log is the only thing that says
# so.
#
# It is not settable from here because `sv_tickrate` is FLAG_STARTUP_ONLY: the console
# locks it the moment the listener opens, and a game's `cvars:` block is applied when the
# GAME loads, which is afterwards. So a server that runs this game sets it before boot:
#
#     cfg/server.yml   sv_tickrate: 128
#     or at launch     ./server -- +sv_tickrate 128
#
# 128 is the figure the genre runs and what this game's own project.godot exports, so a
# developer running it standalone gets 128 and a server left on the default does not --
# which is exactly the gap this comment exists to close.

cvars:
  # [b]The map list a delivered server has instead of a directory.[/b] The game finds
  # its maps by looking, and on a box running from source that is enough -- all eight
  # are on its disk. This server mounts the game as a pack with `maps/imported/`
  # excluded (see the note above about why), so it looks at a directory that is not
  # there, finds the three built-in scenes, and that is the whole set: `maps` lists
  # three, the rotation can only ever choose between three, and `rtv` offers three.
  #
  # Naming them here does not put 66 MB in this repository -- each is published as its
  # own pack and fetched in the background after boot, once, into the content cache.
  # The ids are the content ids, which is why there is no second list anywhere mapping
  # one to the other.
  #
  # A map added to the CDN is added to this line. That is a list, and a list is what the
  # game's own catalogue refuses to keep for exactly the right reason -- but the reason
  # is that the disk cannot go stale and a list can, and a CDN is not a disk this process
  # can read. An id here that nobody published is one warning in the log and no other
  # harm; the alternative, which is what this server shipped with, is a surf server that
  # never plays a surf map.
  sv_content_maps:
    - surf_mesa
    - surf_beginner2
    - surf_kitsune
    - surf_aquaflow
    - surf_arcade
    - surf_interference
    - surf_summit
    - surf_year3000

  sv_airaccelerate: "1000"
  sv_autobunnyhopping: "1"
  sv_enablebunnyhopping: "1"
  sv_gravity: "800"
  sv_allow_thirdperson: "1"
  sv_replay_bot: "1"
