# playground. A physics sandbox in the shape the genre grew up on: hold Q for a menu of
# props, NPCs and weapons, click one and it is yours; a physics gun that holds and
# freezes, a gravity gun that punts. Plus a jump course on pg_lobby's bonus track,
# because a jump course is not a movement genre and it is what says the timer is not a
# surf-and-bhop thing.
#
#     changelevel playground
#
# kind: pack -- delivered, for the reason content/lobby/game.yml sets out at length.
# Published with `./server pack playground --source games/game-playground`.
#
# ITS PROPS WERE ALREADY WRITTEN THIS WAY, which is why this game was the easiest to
# move: every entity and every weapon in the catalogue is named by PATH
# (`meta.script: res://game/entities/npc_wanderer.gd`) rather than by class, so the
# catalogue needed nothing doing to it. A second pack could add to it without touching
# this one.
#
# THE SCENE IS ALMOST EMPTY, ON PURPOSE. res://scenes/pg_server.tscn is a Playground
# under a plain Node, and Playground registers itself under `playground` in _ready() --
# which is what playground_module.gd looks it up by. The operator's surface is the cvars
# below and the layered PlaygroundConfig, like every DotConfig in the family.
#
# ONE GAME ID, THREE MAPS. pg_lobby, pg_surf_intro and pg_bhop_intro are a rotation
# rather than three games: they are the same game on different geometry, and switching
# between them is dot-map's business rather than dot-server's. Changing a MAP replaces
# the world and nothing else; changing a GAME replaces the module, the netcode and every
# client's scene and puts everybody through signon.

name: Playground
content_id: tmc/playground
version: 0.1.0
kind: pack
max_players: 32

scene: scenes/pg_server.tscn
client_scene: game/playground.tscn
module: game/playground_module.gd

# Set when this game is loaded, and only while it is loaded.
#
# A sandbox is not a records server, so the map runs until somebody votes it out rather
# than on a timer: people building a thing do not want the map changed under them at
# thirty minutes. 0 disables the limit.
cvars:
  pg_map_seconds: "0"

# The MAP vote inside this game — what the players pick between when a map ends, and
# whether they may extend the one they are on. Its defaults are in the game's own
# game/playground_vote.gd; anything written here overrides them, and the server's own
# user://cfg/playground_vote.json, DOT_VOTE_* and --vote-* override this. Keyed exactly as
# dot-vote's DotVoteRules, enums by name.
#
# `vote:` beside it is a different thing: how the SERVER's vote for the next game
# (cfg/vote.yml) treats this game — its time limit there, its weight, whether it is
# official. Both are read from the descriptor's metadata.
#
# NOTE pg_map_seconds: "0" above stops the MAP's own timer, and it does not stop this
# vote's clock, which has a thirty-minute default of its own — so today the map is
# still put to a vote at twenty-eight minutes. For "runs until somebody votes it out",
# uncomment the block and set `trigger: rtv_only` and `duration_sec: 0`.
#
# metadata:
#   map_vote:
#     end_vote: true           # ask the players when the map's time runs out
#     vote_lead_sec: 120       # this long before the end
#     include_extend: true     # with "extend this map" on the ballot
#     extend_seconds: 900      # by this much
#     max_extends: 4           # at most this many times
#   vote:
#     time_limit_sec: 2400

