# Hungry: Classic. An agar.io-shaped free-for-all — eat food, eat players, do not
# be eaten.
#
# The first non-lobby game on this server, and the one an operator switches to:
#
#     changelevel hungry_classic
#
# TWO DIRECTORIES, ONE MODULE. Hungry is one game with two modes, and dot-server's
# unit of "what is running" is a game id — so each mode is its own directory here
# and both name the same module. TmcHost compares module PATHS rather than game ids
# when the game changes, so switching between these two rebinds the module in place
# instead of unloading and reloading it, which would drop every connected player for
# no reason.

name: "Hungario: Classic"
content_id: tmc/hungry       # shared with hungry_frenzy: one client, two modes
version: 0.1.0
kind: pack
max_players: 32

scene: game/modes/classic.tscn
client_scene: game/client/hungry_client.tscn
module: game/hungry_module.gd

# The MODE vote inside this game is configured in the server's
# user://cfg/hungry_vote.json (or DOT_VOTE_* / --vote-*), not here: the four hungry_*
# directories share one module that is bound once and rebound in place, so a
# `metadata: map_vote:` block would be read from whichever mode happened to be running
# when it was first loaded. The defaults are in game/hungry_maps.gd.

