# Hungario: Famine.
#
#     changelevel hungry_famine
#
# Shares a module with hungry_classic — see that directory's game.yml.
# This descriptor is what the host reads to list the mode; the scene itself
# lives in the game repository.

name: "Hungario: Famine"
