# mg-wipeout, as this server publishes it.
#
# Obstacle courses over water: a fall is a restart from the last checkpoint, and two or more
# sides across the line fight a final death in a random arena with props to throw and
# weapons on the floor. The courses are NOT in this pack: they are wipeout_maps below,
# mounted on the server only, because the server sends each client the course it is playing
# as a document and no player needs the files.
#
# Keep scene, client_scene and module in step with mg-wipeout's own game.yml;
# examples/install_descriptor compares the two.

name: Wipeout
content_id: tmc/wipeout
version: 0.1.0
kind: pack
max_players: 24

scene: scenes/wo_server.tscn
client_scene: game/wo.tscn
module: game/wo_module.gd

# Pinned, because TmcContent refuses an unpinned entry rather than resolving one per join.
server_dependencies:
  - tmc/wipeout_maps@0.1.0

cvars:
  # Solo by default: everybody is their own side, and two finishers make a final death.
  wo_teams: "0"
  # The most a course stays open; the longest course asks for five minutes itself and is
  # capped here.
  wo_course_seconds: "210"
  wo_finale_seconds: "100"
  # Stand-ins, so one person on an empty server has somebody to beat to the line and a
  # final death can happen at all.
  wo_bots: "1"
  wo_min_players: "3"
