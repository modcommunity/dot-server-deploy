# Voting for the next GAME.
#
#     !game_nominate g2gfast     a player asks for it
#     !game_rtv                  enough players ask to move on
#     !game_vote 2               the ballot opens and everybody chooses
#     !game_timeleft  !game_next what a player types to find out
#
# EVERY ONE OF THEM IS PREFIXED, and that is not decoration. A game in content/ may
# run a vote of its own for its own MAPS, and those already answer to !rtv,
# !nominate, !timeleft and !nextmap. The console keeps whichever registered first,
# so an unprefixed vote here would take four dead commands and leave the player
# talking to two systems at once. !rtv is about the game in front of you;
# !game_rtv is about which game is next.
#
# This is dot-vote's DotVoteRules, so every setting below is documented on the
# property of the same name and layers the way everything else in this family
# layers: these defaults < this file < DOT_GAME_VOTE_* < --game-vote-* (see below).
#
# ENUMS ARE WRITTEN BY NAME. `method: instant_runoff`, not `method: 2`. A config
# file full of enum indices is one nobody can read or diff, and renumbering an enum
# would silently change what a server does.
#
# TURN IT OFF with `enabled: false`. A server with ONE game on offer (after
# vote_exclude below) turns it off by itself: there is nothing to choose between, so
# there are no !game_* commands and no game clock, and the game's own MAP vote is the
# only vote on the server. With two or more games both votes run at once, each on its
# own clock and its own ballot.
#
# THE ENVIRONMENT AND THE COMMAND LINE use DOT_GAME_VOTE_* and --game-vote-*, not
# dot-vote's own DOT_VOTE_* and --vote-*. Those belong to the MAP vote inside a game,
# which runs in this same process and reads its own layers; one prefix for both would
# make `--vote-extend-seconds 900` change two votes at once.
#
# docs/parity.md in dot-vote maps every setting of the long-standing community
# map-chooser plugins onto these, if you are coming from one.

enabled: true

# --- Which games ----------------------------------------------------------
#
# Not a DotVoteRules setting: this is TMC's, because "which of the things in
# content/ are games a player would choose" is a question about this deployment.
#
# Games named here are never on a ballot. Empty offers every installed game.
vote_exclude: []

# --- When a vote happens --------------------------------------------------

trigger: time_limit

# THE END-OF-GAME VOTE. On: when the time runs out the players are asked what is
# next. Off: the time still runs out, and what is next is whatever an admin set with
# the game_setnextmap console command, what a !game_rtv decided, or the next game in
# content/ order.
end_vote: true

# How long a game runs before the players are asked again — the game's time limit,
# across every map and round it plays. Ninety minutes: a game is the long clock, and
# each map inside it has a clock of its own.
#
# 0 is AROUND THE CLOCK: the game never ends on time, and only a !game_rtv (or an
# admin) changes it. Valid as long as rtv_enabled is on.
#
# A GAME can override this in its own game.yml, under `metadata: vote:
# time_limit_sec:`, which is where it belongs: forty minutes of surf and ten
# minutes of a lobby-sized deathmatch are not the same number and never will be.
# `time_limit_sec: 0` there is that one game around the clock.
duration_sec: 5400

# The ballot opens this long BEFORE the time is up, so the change happens on time
# rather than starting a two-minute vote when the game is already over. Two and a
# half minutes fits the countdown, the ballot, a runoff and the result.
vote_lead_sec: 150

warn_at_sec: "600,300,60,30"

# Open the ballot when this fraction of the time is left instead of vote_lead_sec
# above. 0 uses vote_lead_sec. Useful when games' own limits differ a lot.
# vote_lead_fraction: 0.0

# A counted-down warning before the ballot opens ("a vote starts in 10s"), and a
# shorter one before a runoff. 0 opens it at once. Only the start is announced in
# chat unless announce_countdown_every_sec is on; every second of it is on the
# shell's HUD, counting, with the cues below.
vote_warning_sec: 10
runoff_warning_sec: 5
# announce_countdown_every_sec: false

# Nothing may open another ballot for this long after one closes. Without it a vote
# that fails for want of a quorum is followed immediately by another one.
vote_cooldown_sec: 60

# --- When the time is up -------------------------------------------------
#
# change_now     the change happens the moment the time limit runs out.
# finish_round   a game that has rounds plays the one in progress out, and changes
#                when it ends — at most finish_round_max_sec later (0: however long
#                it takes). A game with no rounds has none to finish and changes on
#                time either way.
#
# A !game_rtv and an admin's command never wait: those are somebody asking for now.
# time_up: change_now
# finish_round_max_sec: 300

# --- Rock the vote --------------------------------------------------------

rtv_enabled: true
rtv_fraction: 0.6
rtv_min_players: 2

# No rtv in the first five minutes of a game. Otherwise the first thing that happens
# every time the game changes is somebody asking to change it again.
rtv_delay_sec: 300

rtv_outcome: open_vote

# After a !game_rtv ballot that changed nothing, how long before another can pass.
# rtv_interval_sec: 240

# When the winner of a !game_rtv ballot takes effect: immediate, end_of_round or
# end_of_time. Separate from `apply` below, because "we want to stop now" answered at
# the end of the clock is not an answer.
# rtv_apply: immediate

# What a passed !game_rtv does once the next game is already decided: change_now
# (bring it forward) or deny.
# rtv_after_decided: change_now

# --- Nominations ----------------------------------------------------------

nominations_enabled: true
nominations_per_player: 1
nominations_max: 8

# Ballot places kept for what players asked for. The rest are filled by `fill`
# below, which is what stops three organised players deciding every game.
nomination_slots: 3

# Whether a player leaving takes their nominations with them. Off: a nomination is a
# request of the server, not of the person.
# nominations_forget_leavers: false

# --- The ballot -----------------------------------------------------------

max_options: 5
fill: least_recently_played

# "Extend this game" on the ballot, by how long, and how many times. max_extends: 0
# is unlimited; include_extend: false takes it off the ballot entirely. Once a game
# has been extended max_extends times the option is left off rather than offered and
# refused.
include_extend: true
extend_seconds: 600
max_extends: 3
include_keep: false

# On a !game_rtv ballot, offer "don't change" instead of "extend" — the game still
# had time on it, and "don't change" carries on from there rather than adding more.
# early_vote_keep: true

# A "no vote" option: recorded, closes that player's part of the ballot, counts toward
# the quorum and toward nothing else.
# include_abstain: false

# List extend / don't change / no vote first rather than last. Presentation only:
# ties are still broken as though the games came first.
# pseudo_options_first: false

# Shuffle the ballot so the first-nominated game is not always at the top.
# shuffle_ballot: false

# How a game marked `official: false` in its game.yml (metadata: vote:) is shown.
# %s is the name; empty marks nothing.
# unofficial_marker: "*%s"

vote_duration_sec: 30
close_when_all_voted: true

# How a player chooses on the ballot drawn on their screen:
#   numbers   the number keys, as a numbered menu always has. Nothing takes the mouse.
#   pointer   F3 frees the mouse and they click an option; the number keys stay the
#             game's (for a game that switches weapon on them).
#   both      either. The default.
# Typing !game_vote 2 works whatever this says.
# ballot_input: both

# Each voter's avatar sits on the option they chose and moves when they change their
# mind. Off sends the counts and no names, for a secret ballot.
# ballot_show_voters: true

# --- Counting -------------------------------------------------------------
#
# Plurality is the default and the one everybody understands. `instant_runoff` is
# the one worth trying on a server with five games and no clear favourite: it
# transfers a ballot whose first choice is eliminated instead of throwing it away.
method: plurality
tie_break: nomination_order

# Fraction of the players in the game who must vote for the result to stand. 0 turns
# it off; a server where most people ignore the vote wants it off, because otherwise
# nothing ever passes.
quorum: 0.0
on_no_quorum: winner_anyway

# A ballot nobody voted in: keep (stay), random (draw one of the ballot's games, never
# extend) or rotation (the next in content/ order).
# on_no_votes: keep

# The limit running out with NOBODY connected (hibernation off, see server.yml): random (draw
# one of the ballot's options, never the one running), rotation, or wait (stay, as it used to).
# empty_choice: random

# Whether a clock that waited out a hibernation starts again from the top on the next join
# (true), or carries on from where it stopped.
# wake_restart: true

# --- History --------------------------------------------------------------

# Games excluded after being played. Deliberately small: there are five games here,
# and a cooldown of five would exclude all of them. dot-vote clamps it against the
# pool anyway, and says so in the log when it does.
cooldown: 1
cooldown_mode: plays

# --- Applying -------------------------------------------------------------
#
# A game change puts every client through signon and, for a delivered game, a
# download. `end_of_time` means the vote finishes early and the change still happens
# exactly when the game was going to end.
apply: end_of_time
apply_delay_sec: 5

# --- Sound cues -----------------------------------------------------------
#
# dot-audio ids for the ballot opening and closing, the countdown starting (and the
# runoff one), and each second of it (%d is the second). Empty is silent.
#
# Sent to every playing client as a dot-server notice and played by the client
# shell, out of its own catalogue (client/notice_overlay.gd). These four are the ids
# it has; an id it does not have is silence, not an error, so a cue named here that
# the players' build predates costs a sound and nothing else.
cue_vote_start: "tmc_vote_start"
cue_vote_end: "tmc_vote_end"
cue_warning: "tmc_vote_warning"
cue_runoff_warning: "tmc_vote_warning"
cue_countdown: "tmc_vote_count"
cue_countdown_at: "10,5,4,3,2,1"
