# What THIS SERVER says about each game, over what the game's author shipped.
#
# A game's own game.yml travels inside its pack and is replaced by each new version's,
# so it is the author's defaults. This file is yours: nothing but you writes it, every
# game update leaves it alone, and whatever you set here wins.
#
#   defaults:                    every game on this server
#     cvars:
#       sv_alltalk: "1"
#   games:
#     <game>:                    its id (gamemann/game-g2gfast) or its name half
#       name: "Surf & Bhop"      what the server list and the game vote call it
#       max_players: 24
#       cvars:                   any cvar the game reads; see its game.yml for its own
#         g2g_example: "1"
#         mp_teammate_passthrough: "2"   a game with teams: 0 a team-mate is hit and blocks,
#                                        1 a shot passes one at the muzzle, 2 passes every one
#         sv_voice_enable: "0"           voice chat off in this game (1, the default, on); every
#                                        game reads it, the server stops relaying and clients
#                                        hide their talk key
#         sv_voice_mode: "1"             who hears a speaker: 0 the game decides, 1 everybody,
#                                        2 the speaker's team, 3 players nearby
#         sv_map_menu_flag: "generic"    who changes the map at once from the M map menu: an
#                                        admin flag (generic, the default, is every staff group
#                                        from moderator up; changemap narrows it to admins;
#                                        "anyone" lets everybody). Empty or missing is staff
#                                        only, never everybody. Everybody else's choice is a
#                                        vote (nominate, then rock the vote). Under defaults:
#                                        for every game; a game's own section wins
#         sv_map_menu_alone: "1"         1 (the default): the only human playing may change the
#                                        map from M at once, with nobody to ask; a second human
#                                        makes it a vote again. 0: staff only, plus votes. Bots
#                                        never count
#         sv_map_menu_vote_min: "2"      humans playing before an M choice rocks the vote (2,
#                                        never fewer); below it the choice only nominates, and
#                                        a rock never passes on fewer than most of the humans
#       metadata:                merged key by key into the game's metadata:, e.g.
#         map_vote:              its map vote and rotation (dot-vote's settings)
#           duration_sec: 1800
#         vote:                  this game's time limit in the server's game vote
#           time_limit_sec: 2400
#       map_owner: gamemann      who a bare map name below belongs to (optional)
#       maps:
#         game_maps: true        also offer the maps the game itself lists (the default)
#         add:                   maps to offer on top
#           - owner/map          the newest on the content origin, checked every start
#           - owner/map@1.2.0    held at that version until you change it here
#           - owner/collection/*  every map the collection (a map repository) publishes,
#                                expanded every start; e.g. gamemann/g2gfast-maps/*. Exactly
#                                this shape (no partial globs, no @version): pin a map
#                                beside it (owner/map@1.2.0 wins) or take one out in remove:
#           - surf_mesa          a bare name works too: its owner is map_owner: (the game's,
#                                then defaults:), else the game's own sv_map_content_owner
#                                cvar, else the owner of the game's own id. If none of those
#                                says, the server refuses to start and names the entry
#         remove:                maps the game lists that this server does not want
#           - owner/map          (a bare name matches the same map as its owner/map spelling)
#           - owner/collection/*  takes the whole collection out of an earlier list
#
# Order: the game's game.yml < defaults < games: <game>. Cvars and metadata merge key by
# key; a list replaces a list. What makes a game the game it is -- scene, client_scene,
# module, kind, content_id, version, its dependencies -- cannot be set here, and the
# server refuses to start if you try, rather than run something else under its name.
#
# Maps: nothing is downloaded at boot. `./server` (install-games, every start) asks the
# origin which version of each map is newest and keeps the answers in
# data/content-maps.json; a map is fetched the first time the server changes to it. An
# upload of a new version reaches this server on its next restart, and if the origin is
# down at a restart every map keeps the version it had. Only a game that reads its
# descriptor's maps uses this list (game-g2gfast does); a game that ships all its maps as
# one pack names that pack in its own game.yml instead.

