# General server settings.
#
# Anything dot-server exposes as a console variable can go here too, under its own
# name -- this file is compiled to a .cfg and handed to dot-server's console, which
# is the parser and the validator. data/from_yaml.cfg is what it became; read that
# when a setting appears not to work.

sv_name: "TMC Test Server"
sv_maxplayers: 64

# How long to hold the slot of a player whose browser tab went into the background.
#
# A BROWSER STOPS DRIVING THE GAME'S MAIN LOOP FOR A HIDDEN TAB. It stops calling
# requestAnimationFrame, which stops _process, every timer and the multiplayer poll
# together -- so the client sends no heartbeat and reads nothing, while its socket
# sits open and perfectly healthy. To the server that is indistinguishable from a
# machine that died, and `sv_timeout` (60s by default) drops the player about a
# minute into a tab switch. This is the setting that stops that.
#
# The client announces the switch on its way out, while the page is still live, and
# announces its return; the server holds the slot for up to this many seconds. It is
# a ceiling on what a client may ask for, not a grant -- a number a client chose for
# itself would be a way to sit on a slot of a full server indefinitely.
#
# KEEP IT IN MINUTES. While the tab is hidden the server goes on sending to a client
# that is not reading, and those bytes queue: the longer the grace, the bigger the
# burst on the way back and the more a parked tab costs everyone still playing.
# 0 refuses the grace entirely and restores the old behaviour.
sv_background_grace: 300

# Empty means anyone may join.
sv_password: ""

# Whether the server reads commands from its own stdin when stdin is a PIPE.
#
# A terminal is always read, and a file too. A pipe is not, by default, because a
# reader waiting on a pipe whose writer never closes stops the process from exiting.
# Turn this on only if something (a supervisor, `docker run -i` without `-t`) feeds
# console commands down a pipe, and have it close the pipe to stop the server.
# RCON (rcon.yml) is the usual way in, and needs none of this.
# sv_stdin_console_pipes: false

# Simulation rate. Higher is more responsive and costs CPU and bandwidth on every
# client as well as here. Fixed at boot.
sv_tickrate: 60

# Which game in the content directory boots.
#
# Empty means "whatever content/ says is the default" -- a game marks itself with
# `default: true` in its descriptor, and failing that the first one found wins. Set
# it here to pin a box to one game regardless of what is dropped in beside it.
#
# `./server --game <id>` and TMC_GAME both override this, and a running server is
# moved with `changegame <id>` over RCON without a restart. `./server games` lists
# what this content directory actually has.
sv_game: ""

# Which map that game starts on.
#
# Empty means the game's own default, which is the normal case: a game that has maps
# names one in its own config and that is where the reasoning about which one lives.
# This is for a box that runs the same game as another and should come up somewhere
# else -- a second surf server on the same content, say.
#
# `./server --map <id>`, TMC_MAP, and `./server -- +map <id>` all override this. The
# last of those is the spelling every other dedicated server uses and is why this
# setting exists at all; it used to be accepted, dispatched into a console that had
# no game loaded yet, and dropped without a word.
#
# A GAME DECIDES WHETHER IT HAS MAPS. A lobby and an arena of built geometry do not,
# and neither does a game whose catalogue has never heard of this id. Both are a line
# in the log and not a refusal to boot -- an operator's typo should not cost a server
# that is already full of people.
sv_map: ""

# The app's URL segment on the website, reported in a query as the game's name.
#
# Unique and lowercase because the site already made it so, which is the whole
# reason to reuse it rather than invent a second identifier that has to be kept in
# step. Empty falls back to the running game's id, which is the right answer on a
# box running one game.
#
# DISPLAY ONLY. A server can claim any app it likes, and nothing that has to be
# certain which app a server belongs to -- a launch resolving a build, a play grant
# -- reads this. Those ask the backbone, which knows. It is what a listing prints
# next to the hostname, and it is also A2S's `folder`, which is the field trackers
# group servers by.
#
# `sv_query_app` is also a cvar, so it can be changed on a running server.
sv_query_app: ""

sv_tags: [lobby, tmc]

# Server queries.
#
# `query_enabled` is on by dot-server's own default and answers the dot query
# protocol (DQP). `a2s_enabled` adds the twenty-year-old one beside it on the same
# socket -- told apart by the first four bytes -- because the trackers, uptime
# monitors and server browsers that already exist speak A2S and nothing else. TMC's
# own scanner is one of them.
#
# `query_bind_ip` is the setting a reverse-proxied server cannot do without. Set
# `net_bind_ip` to loopback when nginx terminates TLS in front of the game, and
# nginx forwards a WebSocket but CANNOT forward UDP -- so a query listener sharing
# that setting is listening where nothing can ask it, and a tracker cannot tell that
# from a server that is down. `*` puts the query port, and only the query port, on
# every interface. RCON deliberately does not follow it.
a2s_enabled: true
query_bind_ip: "*"

# The games this server offers, or nothing for everything in content/.
#
# A server no longer has to carry the whole catalogue. A game is a signed pack on
# the content origin plus a `game.yml` that says how to start it; `./server install-games`
# fetches both, and `./server` does it at startup when this is set. So a box holds the two
# or three games it is for, and adding one is a restart rather than a redeploy.
#
# It is also a FILTER, and it has to be, because installing two games does not by itself
# stop a content directory that already has ten from offering all of them. The `games`
# listing, `changelevel`, the vote menu and the boot game all read the same scanned set,
# and this narrows it once, before any of them see it.
#
# Empty means everything, which is what a development checkout and a hand-run server want.
# `sv_game` must name one of these; a game that is asked for and is not installed is
# reported at boot and is not fatal.
#
#games:
#  - g2gfast
#  - arena

# Where this server fetches content it does not have, tried in order.
#
# A game's imported maps are not in its repository -- `maps/imported/` is gitignored,
# because 66 MB of converted geometry does not belong in a git history -- so a server
# stood up by cloning the repositories has the game and none of its maps. They are
# published as signed dot-cloud packs instead, and this is where it looks for them.
#
# `content/` and `dist/` on this box are searched FIRST and need no entry here: a pack
# sitting beside the game, or one this server published itself with `./server pack`,
# is not worth a network request.
#
# Empty means the network half is off, which is right for a LAN deployment and for a
# build that ships everything it runs. A manifest still has to be signed by a key in
# cfg/content.json whatever the source, so adding a URL here is not by itself a way
# to be handed somebody else's scripts.
content_urls:
  - "https://dotgames.org/content"
