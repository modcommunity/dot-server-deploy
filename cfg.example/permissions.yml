# Who is in which group.
#
# A key is matched against a player's uid, their username, and their display name, in that
# order, lower-cased -- so write whichever of the three you know. `groups.yml` says what each
# group may do.
#
# THIS FILE SHIPS EMPTY, and a server with no entry in it is administered from the local
# console and from RCON. That is deliberate: a name written into a public template is a name
# anybody can register on their own account, and every server that never edited the file would
# then hand that person its owner group.
#
# Uncomment and edit:
#
#     users:
#       yourname:                 # by name, for somebody who plays here
#         group: owner
#       backbone:clx8f2k0kd:      # by uid, for somebody who does not
#         group: admin
#
# WRITING A UID, AND WHY YOU WOULD
#
# A name only reaches somebody who is CONNECTED: a name is matched off the identity their
# connection carries. A command typed on the website is sent by somebody who is not in the
# game at all, and all the server is given is a uid -- `backbone:` plus their site id, which
# is not a number anybody can read off their profile.
#
# So the way to find it is to use it once and read the log. Type `/map` into the server's
# chat box on the website; the server answers with a refusal and writes a line saying
# exactly which key to add:
#
#     inf chat.relay  a relayed command was refused  uid=backbone:clx8f2k0kd command=map
#                     fix=add 'backbone:clx8f2k0kd' to the server's admin file with the
#                     'rcon' flag
#
# Paste that uid in below, restart, and the same command works. There is deliberately no
# way to grant it by the name shown beside the message: a display name is a string the
# person can change on their own profile page, and a permission keyed on one is a
# permission anybody can take by renaming themselves.
#
# TWO ENTRIES FOR ONE PERSON is the honest shape rather than a wart. A name covers them in
# game, because a connected player's identity carries their username; a relayed line carries
# only the uid. The site lets a member change their username and the old handle is then free
# for anybody to take, so a name and an id are not interchangeable keys: the name is
# convenient and the id is durable, and the remote path is the one that has to be durable.
#
# See cfg/auth.yml: without authentication this file does nothing at all.
