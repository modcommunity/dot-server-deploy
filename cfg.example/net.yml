# Network & bind.

net_bind_ip: "0.0.0.0"
net_port: 6064

# How clients connect. `dual` (the default): browsers over WebSocket on TCP net_port,
# native (desktop app) clients over ENet on UDP net_enet_port, in the same match. A
# native client tries UDP first and falls back to WebSocket. `websocket` puts everyone
# on WebSocket (the behaviour before dual); `enet` serves native clients only.
net_transport: dual

# 0: the same number as net_port, over UDP. A2S and DQP answer there too by default;
# the server tells the three apart by their first bytes (net_enet_share_udp). Publish
# the UDP port as well as the TCP one. nginx does not carry UDP: the ENet port is
# reached directly, never through the proxy, and needs no certificate.
net_enet_port: 0
# Empty follows query_bind_ip, which is what a server behind nginx wants.
net_enet_bind_ip: ""

# Uses the bind IP if not set. Only needed if the server is behind NAT. Nothing binds
# to it -- it is what the join address is printed from and what a listing reports.
net_public_ip: ""

# Performance
# -----------------------------------------
# These are CEILINGS on what each game asks for, applied when the game's module loads:
# the value in force is the lower of the game's and yours, and 0 on either side means no
# limit from that side. Existing boxes keep their own cfg/net.yml.

# Maximum bytes per second per client (1000000 is about 8 Mbit/s). 0 = unlimited.
net_max_bps: 1000000

# Maximum packets per second per client. 0 = unlimited. Leave it at 0 unless you know
# the game's update rate: a packet cap below it starves snapshots.
net_max_pps: 0

# Maximum snapshots per second sent to a client. 0 = use the game's own rate. Never
# above the game's tick rate; it is lowered to a divisor of the tick rate if need be.
net_max_update_rate: 0
