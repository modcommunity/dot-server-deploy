# Authentication. Who a connecting player is, and whether the server can prove it.
#
# Absent or disabled, everybody arrives as a guest with a per-device id through
# DotGuestIdentity, and the server works. That is the simplest deployment there is
# and it is deliberately a supported one.
#
# WORTH KNOWING: DotAdminManager refuses permissions to any unauthenticated
# session -- a guest uid is a random per-device string, so granting anything to one
# grants it to anyone. While this is off, cfg/permissions.yml has no effect and the
# local console is the only administrator. That is correct, and it looks exactly
# like the file being ignored.

# On for a new install, in ticket mode with nothing to fill in: the server learns its
# site id and the site's public key from the site it enrolled with (data/listing.json),
# over HTTPS, and keeps them in data/ticket_trust.json. A member signed in to the site
# arrives as themselves; anybody else plays as a guest. Override any of this in
# cfg/server/addons/dot_auth/auth.yml.
enabled: true

# ticket | introspect | local | anonymous
#
#   ticket       The client asks the site for a short-lived ticket for the address it
#                dialled, and this server verifies it OFFLINE against the site's public
#                key. The player's account token never reaches the server. Safe for a
#                server run by somebody the players do not know.
#   introspect   The game's own servers only (set first_party: true): the client sends a
#                single-use join token and this server asks the site who it is. Without
#                first_party and server_id it is read as ticket, with a warning.
#   local        Accounts in a file on this server. No site involved.
#   anonymous    Nobody is authenticated. The same as enabled: false.
strategy: ticket

# The site's id for this server, the audience every ticket must name. Empty: learnt from
# the site at boot. Set it only to pin it; a pinned id wins over the site's.
server_id: ""

# The issuer's PUBLIC key as a file, relative to this directory. Empty: fetched from the
# site this server enrolled with. A file named here wins over the fetched keys; a private
# key is refused.
issuer_public_key_file: ""

# The site: where tickets come from, where this server enrolled, where keys are fetched.
backbone_url: "https://moddingcommunity.com"

# Admit players whose authentication failed or was unavailable, as guests.
#
# Sensible for a casual server that would rather have players than identities. Off
# where bans need to mean something, because a guest can always come back as a
# different guest.
allow_guests: true

# Report this server's roster to the issuer, so a player who leaves is released at once
# instead of being held for the issuer's lease (5 minutes) and locked out of every other
# server until it runs out. Needs `server_id`, and the key the publisher hands you with the
# public key -- in a FILE, relative to this directory: a secret is never read from this YAML,
# the environment or the command line. A server stopped with the console's `quit` sends the
# empty roster on the way out; a killed one leaves its players held until the lease ends.
# session_report_url: "https://moddingcommunity.com"
# session_report_key_file: "session_report.key"
# session_report_interval_sec: 60

# Accounts file for `local`, relative to this directory.
# local_accounts_file: "accounts.json"
