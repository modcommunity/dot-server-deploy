# Remote console.
#
# An EMPTY password means the RCON listener does not open at all, which is the right
# setting for a server nobody administers remotely. There is no configuration that
# produces an unauthenticated remote console.
#
# The password below was generated by setup.sh on this machine, once, and printed
# once. It is not in the repository and never was: a password shipped in a public
# template is a password everybody has. Change it here if you like, and do NOT put it
# in a command line or an environment variable -- both are readable by any other
# process on the machine and both end up in pasted bug reports, which is why
# ./server refuses --rcon-password outright.
#
# rcon_allowed is the control that survives a leaked password, so it ships closed:
# loopback only, which means an SSH tunnel by default and a deliberate edit to widen
# it. These servers face the internet and a remote console is the whole machine.

rcon_password: "@RCON_PASSWORD@"
rcon_port: 0                  # 0 uses the game port + 1
rcon_allowed: ["127.0.0.1"]   # localhost only; empty allows any address
rcon_websocket: false         # for a browser-based admin panel
