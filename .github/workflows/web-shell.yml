# Exports, uploads and pins the web shell whenever what it is built from changes, then
# releases the pin as the next tag. Nobody exports, uploads, pins or registers a shell by
# hand any more; tools/publish-web-shell.sh is the fallback (docs/releases.md,
# "Publishing the web build").
#
# Game packs carry no addons, so a game runs on the addon code compiled into the shell
# its server pins. A lock bump released without a new shell made every game built on it
# "needs dot-combat API level 5 or newer; this client has level 4" at Play (2026-10-20).
#
# [b]No loops.[/b] The job first compares tools/shell-inputs.sh's fingerprint of main with
# web/shell-build.inputs and does nothing when they agree. The pin commit changes only
# web/shell-build and its record, neither of which is an input, and it is pushed with the
# workflow's own token, which starts no workflow run. The tag is released by dispatching
# release.yml, the one event that token may start.
#
# [b]main, not the pushed commit.[/b] Runs queue one deep (concurrency below), so the run
# that gets to go builds whatever main is by then, and a run whose push was overtaken
# finds the record already matching and stops.
name: Web shell

on:
    push:
        branches: [main]
        # A copy of tools/shell-inputs.sh's INPUT_PATHS plus the engine pin and this
        # machinery. It only decides when to look; the job compares the fingerprint.
        paths:
            - addons.lock
            - content-lists/addons.yml
            - 'client/**'
            - project.godot
            - export_presets.example.cfg
            - web/embed.html
            - web/tmc-loader.js
            - tools/fetch-godot.sh
            - tools/shell-auth-json.sh
            - tools/shell-inputs.sh
            - .github/workflows/web-shell.yml
    workflow_dispatch:
        inputs:
            force:
                description: Export and pin even when the record matches (a broken upload, a new backbone URL).
                type: boolean
                default: false

concurrency:
    group: web-shell
    cancel-in-progress: false

permissions:
    contents: write # the pin commit and the tag
    actions: write # dispatching release.yml on the tag

jobs:
    shell:
        runs-on: ubuntu-latest
        timeout-minutes: 75
        env:
            WEB_SHELL_APP: ${{ vars.WEB_SHELL_APP || 'godot' }}
            WEB_SHELL_ORIGIN: ${{ vars.WEB_SHELL_ORIGIN }}
            WEB_SHELL_BACKBONE_URL: ${{ vars.WEB_SHELL_BACKBONE_URL }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.repository.default_branch }}
                  # Every tag, so the next v0.1.x is computed from all of them.
                  fetch-depth: 0

            - name: Is the pinned shell this tree's?
              id: need
              env:
                  FORCE: ${{ inputs.force }}
              run: |
                  set -uo pipefail
                  rc=0; tools/shell-inputs.sh check || rc=$?
                  if [ "$rc" = 0 ] && [ "$FORCE" != "true" ]; then
                      echo "web/shell-build ($(cat web/shell-build)) was exported from this tree; nothing to build."
                      echo "build=false" >> "$GITHUB_OUTPUT"
                      # [b]But is it released?[/b] A pin that reached main without its tag
                      # (an earlier run that died between push and dispatch, a hand push)
                      # is a shell no release names, so dot-ci's server-compat and every
                      # game release still see the previous one. No v* tag at or after the
                      # pin commit: tag main (its record matches, so release.yml's gate
                      # passes) and release it.
                      pin="$(git log -1 --format=%H -- web/shell-build.inputs)"
                      if [ -n "$pin" ] && [ -z "$(git tag --contains "$pin" -l 'v*')" ]; then
                          last="$(git tag -l 'v*' | sort -V | tail -1)"; last="${last:-v0.0.0}"
                          tag="${last%.*}.$(( ${last##*.} + 1 ))"
                          git config user.name "github-actions[bot]"
                          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                          git tag -a "$tag" -m "Web shell $(cat web/shell-build)" || exit 1
                          git push -q origin "refs/tags/$tag" || exit 1
                          echo "the pin $(git rev-parse --short "$pin") had no release; tagged main $tag"
                          echo "untagged=$tag" >> "$GITHUB_OUTPUT"
                      fi
                      exit 0
                  fi
                  [ "$rc" -le 2 ] || exit "$rc"
                  echo "build=true" >> "$GITHUB_OUTPUT"

            - name: Release the pin that had no tag
              if: steps.need.outputs.untagged != ''
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ steps.need.outputs.untagged }}
              run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"

            - name: Settings this needs
              if: steps.need.outputs.build == 'true'
              env:
                  S3_KEY_SET: ${{ secrets.GAMES_S3_ACCESS_KEY != '' && secrets.GAMES_S3_ACCESS_SECRET != '' && secrets.GAMES_S3_BUCKET != '' }}
              run: |
                  missing=()
                  [ "$S3_KEY_SET" = true ] || missing+=("secrets GAMES_S3_ACCESS_KEY, GAMES_S3_ACCESS_SECRET, GAMES_S3_BUCKET")
                  [ -n "$WEB_SHELL_BACKBONE_URL" ] || missing+=("variable WEB_SHELL_BACKBONE_URL (client/auth.json's backbone_url)")
                  [ -n "$WEB_SHELL_ORIGIN" ] || missing+=("variable WEB_SHELL_ORIGIN (the content origin, e.g. https://cdn.example.net)")
                  if [ "${#missing[@]}" -gt 0 ]; then
                      printf 'missing repository settings:\n'; printf '  %s\n' "${missing[@]}"
                      exit 1
                  fi

            - name: Install what the runtime and the zip need
              if: steps.need.outputs.build == 'true'
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq --no-install-recommends \
                      libfontconfig1 libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 zip unzip brotli

            # The templates are pinned with digests in tools/; the cache only saves the
            # download (about 1 GB), the script still verifies what it finds.
            - name: Cache the export templates
              if: steps.need.outputs.build == 'true'
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.local/share/godot/export_templates
                  key: godot-templates-${{ hashFiles('tools/fetch-godot.sh', 'tools/fetch-export-templates.sh') }}

            # The addons at the lock, fresh clones (setup.sh moves only its own clones,
            # and these are all its own). --no-games: the shell ships no game.
            - name: Set up at the lock
              if: steps.need.outputs.build == 'true'
              env:
                  DEPS_TOKEN: ${{ secrets.DOT_DEPS_TOKEN }}
                  GIT_TERMINAL_PROMPT: '0'
              run: |
                  set -euo pipefail
                  if [ -n "$DEPS_TOKEN" ]; then
                      git config --global url."https://x-access-token:${DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
                  fi
                  ./setup.sh --no-games
                  # Only for the clones: the push below uses the checkout's own token.
                  git config --global --unset-all url."https://x-access-token:${DEPS_TOKEN}@github.com/".insteadOf 2>/dev/null || true
                  tools/addons-lock.sh check

            - name: Export
              if: steps.need.outputs.build == 'true'
              run: |
                  set -euo pipefail
                  # A deployment's answer, untracked; the same file demo.sh writes. No
                  # first-party list: the shell asks the site (play/first-party) at sign-in.
                  tools/shell-auth-json.sh "$WEB_SHELL_BACKBONE_URL" > client/auth.json
                  ./server export-web --zip
                  cat web/build/shell-inputs.txt

            - name: Upload, pin and tag
              if: steps.need.outputs.build == 'true'
              id: pin
              env:
                  GAMES_S3_ACCESS_KEY: ${{ secrets.GAMES_S3_ACCESS_KEY }}
                  GAMES_S3_ACCESS_SECRET: ${{ secrets.GAMES_S3_ACCESS_SECRET }}
                  GAMES_S3_BUCKET: ${{ secrets.GAMES_S3_BUCKET }}
                  GAMES_S3_REGION: ${{ secrets.GAMES_S3_REGION }}
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  tools/publish-web-shell.sh --zip web/build.zip --pin \
                      --app "$WEB_SHELL_APP" --origin "$WEB_SHELL_ORIGIN" \
                      --notes "Exported by the web-shell workflow, run ${{ github.run_id }}, from $(git rev-parse --short HEAD)"
                  tag="$(git describe --tags --exact-match HEAD)"
                  echo "tag=$tag" >> "$GITHUB_OUTPUT"
                  echo "### Web shell $(cat web/shell-build), released as $tag" >> "$GITHUB_STEP_SUMMARY"

            - name: Release the tag
              if: steps.need.outputs.build == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ steps.pin.outputs.tag }}
              run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"

    # Publishes web/tmc-loader.js to the site's shared loader, the page script that frames
    # every shell. It is not part of the shell (the site serves it), so it needs no export
    # and runs beside the shell job, not after it.
    #
    # [b]Every run, not only when the file changed.[/b] The label is the last commit that
    # touched the file, and the site answers a label it already has with the same bytes as
    # "unchanged" and writes nothing. So a run whose push was overtaken (the queue above) or
    # a manual dispatch can never lose a loader change, and repeating one costs a request.
    #
    # The key opens exactly that endpoint (Admin, Game, "Loader publish key"). Unset, the
    # job skips with a notice: a fork or a box without the site still builds its shell.
    loader:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.repository.default_branch }}
                  fetch-depth: 0

            - name: Publish the shared loader
              env:
                  KEY: ${{ secrets.TMC_LOADER_PUBLISH_KEY }}
                  SITE: ${{ vars.TMC_SITE_URL || vars.WEB_SHELL_BACKBONE_URL }}
              run: |
                  set -euo pipefail
                  if [ -z "$KEY" ]; then
                      echo "::notice::TMC_LOADER_PUBLISH_KEY is not set, so the shared loader was not published. Upload web/tmc-loader.js by hand (docs/releases.md)."
                      exit 0
                  fi
                  if [ -z "$SITE" ]; then
                      echo "::notice::Neither TMC_SITE_URL nor WEB_SHELL_BACKBONE_URL is set, so there is no site to publish the shared loader to."
                      exit 0
                  fi
                  sha="$(git log -1 --format=%H -- web/tmc-loader.js)"
                  label="git-${sha:0:12}"
                  notes="web/tmc-loader.js at ${sha:0:12}, published by the web-shell workflow, run ${{ github.run_id }}"
                  enc() { jq -rn --arg v "$1" '$v|@uri'; }
                  url="${SITE%/}/api/app/v1/web/loader?label=$(enc "$label")&notes=$(enc "$notes")"
                  # The key goes in a header file, never on the command line, where it
                  # would be in the process list; curl's own output never includes it.
                  hdr="$(mktemp)"
                  trap 'rm -f "$hdr"' EXIT
                  printf 'Authorization: Bearer %s\n' "$KEY" > "$hdr"
                  code="$(curl -sS -o body.json -w '%{http_code}' --max-time 60 -X POST \
                      -H @"$hdr" -H 'Content-Type: application/javascript' \
                      --data-binary @web/tmc-loader.js "$url")" || code="000"
                  echo "HTTP $code"
                  cat body.json 2>/dev/null || true
                  echo
                  case "$code" in
                      2??) echo "### Shared loader $label: HTTP $code" >> "$GITHUB_STEP_SUMMARY" ;;
                      *) echo "::error::Publishing the shared loader failed with HTTP $code (body above)."; exit 1 ;;
                  esac
