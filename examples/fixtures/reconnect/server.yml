# A fixture for examples/reconnect.tscn. Its own port, because this suite binds the same
# address twice and must not race a `multigame` or `live_switch` run on 27101.
sv_name: "Reconnect Fixture"
sv_maxplayers: 8
sv_game: "lobby"

# Off, and the suite does not work without it. Two servers are started in one process
# here -- that is what a restart is -- and each one starts a thread blocked in a read of
# this terminal's stdin that the engine offers no way to cancel. The checks all pass and
# the process then never exits, which reads as a hung suite rather than as a console
# nobody asked for.
# Still off after dot-server 5f46687 (a pipe is not read by default any more): a
# terminal would still be, and a suite takes no commands.
sv_stdin_console: false
