# Remote console.
#
# An EMPTY password means the RCON listener does not open at all, which is the right
# setting for a server nobody administers remotely. There is no configuration that
# produces an unauthenticated remote console.
#
# This ships EMPTY, so a fresh checkout has no remote console until you ask for one.
# A password shipped in a public repository is a password everybody has, so there is
# nothing to generate here that would be worth anything.
#
# To turn RCON on, put a long random password below -- `head -c 24 /dev/urandom |
# base64` is enough. Do NOT put it in a command line or an environment variable: both
# are readable by any other process on the machine and both end up in pasted bug
# reports, which is why ./server refuses --rcon-password outright.
#
# rcon_allowed is the control that survives a leaked password. Populate it.

rcon_password: ""
rcon_port: 0            # 0 uses the game port + 1
rcon_allowed: []        # empty allows any address
rcon_websocket: false   # for a browser-based admin panel
