# General server settings
sv_name: "TMC Test Server"
sv_maxplayers: 64

# Which game in the content directory boots.
#
# Empty means "whatever content/ says is the default" -- a game marks itself with
# `default: true` in its descriptor, and failing that the first one found wins. Set
# it here to pin a box to one game regardless of what is dropped in beside it.
#
# `./server --game <id>` and TMC_GAME both override this, and a running server is
# moved with `changegame <id>` over RCON without a restart. `./server games` lists
# what this content directory actually has.
sv_game: ""

# The app's URL segment on the website, reported in a query as the game's name.
#
# Unique and lowercase because the site already made it so, which is the whole
# reason to reuse it rather than invent a second identifier that has to be kept in
# step. Empty falls back to the running game's id, which is the right answer on a
# box running one game.
#
# DISPLAY ONLY. A server can claim any app it likes, and nothing that has to be
# certain which app a server belongs to -- a launch resolving a build, a play grant
# -- reads this. Those ask the backbone, which knows. It is what a listing prints
# next to the hostname, and it is also A2S's `folder`, which is the field trackers
# group servers by.
#
# `sv_query_app` is also a cvar, so it can be changed on a running server.
sv_query_app: ""

# Server queries.
#
# `query_enabled` is on by dot-server's own default and answers the dot query
# protocol (DQP). `a2s_enabled` adds the twenty-year-old one beside it on the same
# socket — told apart by the first four bytes — because the trackers, uptime
# monitors and server browsers that already exist speak A2S and nothing else. TMC's
# own scanner is one of them.
#
# `query_bind_ip` is the setting a reverse-proxied server cannot do without.
# `net_bind_ip` is loopback here because nginx terminates TLS in front of the game,
# and nginx forwards a WebSocket but CANNOT forward UDP — so a query listener
# sharing that setting is listening where nothing can ask it, and a tracker cannot
# tell that from a server that is down. `*` puts the query port, and only the query
# port, on every interface. RCON deliberately does not follow it.
a2s_enabled: true
query_bind_ip: "*"
